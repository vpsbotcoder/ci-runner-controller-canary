name: Direct six-runner canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slot: 1, profile: ci-large}
          - {slot: 2, profile: ci-large}
          - {slot: 3, profile: ci-large}
          - {slot: 4, profile: ci-large}
          - {slot: 5, profile: ci-small}
          - {slot: 6, profile: ci-small}
    runs-on: [self-hosted, Linux, X64, ci-host-g, '${{ matrix.profile }}']
    timeout-minutes: 10
    steps:
      - name: Verify direct user, Docker and simultaneous execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          id -un | grep -Eq '^ci-g-[1-8]$'
          test ! -r /etc/ci-runner-controller/doppler-token
          docker version --format '{{.Server.Version}}'
          test -w "$GITHUB_WORKSPACE"
          echo "started $(date -u +%FT%TZ) $(id -un)"
          sleep 90
          echo "finished $(date -u +%FT%TZ)"
