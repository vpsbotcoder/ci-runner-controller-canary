name: Automatic controller discovery smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, ci-host-guru, ci-small]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automatic runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          id -un | grep -Eq '^ci-guru-[56]$'
          test -w "$GITHUB_WORKSPACE"
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 22) process.exit(1); console.log("automatic-controller-smoke-ok")'
