name: GURU four-heavy two-small acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slot: 1, profile: ci-large}
          - {slot: 2, profile: ci-large}
          - {slot: 3, profile: ci-large}
          - {slot: 4, profile: ci-large}
          - {slot: 5, profile: ci-small}
          - {slot: 6, profile: ci-small}
    runs-on: [self-hosted, Linux, X64, ci-host-guru, '${{ matrix.profile }}']
    timeout-minutes: 10
    steps:
      - name: Verify direct user and Docker build
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          id -un | grep -Eq '^ci-guru-[1-6]$'
          test ! -r /home/debian/.config/doppler/main_cloud.token
          test ! -r /home/debian/.ssh/goozoo
          mkdir -p "$RUNNER_TEMP/synthetic-build"
          printf 'runner-smoke\n' > "$RUNNER_TEMP/synthetic-build/payload"
          printf 'FROM scratch\nCOPY payload /payload\n' > "$RUNNER_TEMP/synthetic-build/Dockerfile"
          tag="ci-guru-acceptance:${{ github.run_id }}-${{ matrix.slot }}"
          trap 'docker image rm "$tag" >/dev/null 2>&1 || true' EXIT
          docker build --quiet --tag "$tag" "$RUNNER_TEMP/synthetic-build"
      - name: Exercise memory and simultaneous slots
        env:
          PROFILE: '${{ matrix.profile }}'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os,time
          mib=5120 if os.environ['PROFILE']=='ci-large' else 384
          memory=bytearray(mib*1024*1024)
          for offset in range(0,len(memory),4096): memory[offset]=1
          print('resident-memory-smoke-MiB',mib,flush=True)
          time.sleep(150)
          PYTHON
